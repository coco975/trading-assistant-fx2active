[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-assistant-fx2active"
version = "0.3.0"
description = "Local M15 78.6% Fibonacci trading assistant and control panel for FX2Active"
requires-python = ">=3.11"
dependencies = [
  "MetaTrader5>=5.0.45; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
